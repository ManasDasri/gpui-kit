name: WebView Windows regression
on:
  push:
    branches: [verify/windows-webview]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
      - name: Reproduce the original WebView2 abort
        run: cargo test -p gpui-webview --features gpui-fast,gpui-kit/gpui-fast --test windows_construction -- --expect-crash
      - name: Apply the GPUI Fast fix to the published dependency
        run: python .ci/prepare-gpui-fast.py
      - name: Verify construction and deferred foreground wakeups
        run: cargo test --config target/webview-regression.toml -p gpui-webview --features gpui-fast,gpui-kit/gpui-fast --test windows_construction
